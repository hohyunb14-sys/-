[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicecut"
version = "0.1.0"
description = "내 목소리 녹음에서 무음, 간투어, 다시 말한 구간을 찾아 잘라 주는 개인용 편집 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]
ai = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
voicecut = "voicecut.cli:main"

[tool.setuptools.packages.find]
include = ["voicecut*"]

[tool.setuptools.package-data]
voicecut = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
